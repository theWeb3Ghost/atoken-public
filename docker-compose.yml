services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/token_radar
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    ports: ["8080:8080"]
    volumes:
      - ./data:/app/data

volumes:
  mongo-data:
  redis-data: